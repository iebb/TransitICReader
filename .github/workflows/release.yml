name: Release
run-name: Release latest TestFlight and Google Play internal builds

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Optional JSON of iOS locale to What’s New text; blank preserves saved App Store notes'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cardbal-stores
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install store clients
        run: python3 -m pip install -r tools/release/requirements-appstore.txt -r android/tools/requirements-play.txt
      - name: Prepare Apple authentication and optional notes
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          RELEASE_NOTES_JSON: ${{ inputs.release_notes }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from tools.release.app_store import read_notes
          directory = Path(os.environ['RUNNER_TEMP']) / 'cardbal-release'
          directory.mkdir(mode=0o700)
          key = directory / 'AuthKey.p8'
          key.write_text(os.environ['ASC_PRIVATE_KEY'])
          key.chmod(0o600)
          notes = directory / 'release-notes.json'
          if os.environ.get('RELEASE_NOTES_JSON', '').strip():
              notes.write_text(os.environ['RELEASE_NOTES_JSON'])
              read_notes(notes)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'ASC_PRIVATE_KEY_PATH={key}\n')
              output.write(f'CARDBAL_NOTES_FILE={notes if notes.exists() else ""}\n')
          PY
      - name: Select latest store builds
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_APP_ID: ${{ vars.ASC_APP_ID }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p build/release
          notes=()
          if [ -n "$CARDBAL_NOTES_FILE" ]; then notes=(--release-notes-file "$CARDBAL_NOTES_FILE"); fi
          python3 -m tools.release.app_store select --app-id "$ASC_APP_ID" "${notes[@]}" > build/release/ios-selection.json
          python3 android/tools/play_release.py inspect-latest-internal --metadata-out build/release/android-selection.json
      - id: selected
        name: Verify versions and pin selected builds
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from tools.release.versions import paired_store_builds
          apple = json.loads(Path('build/release/ios-selection.json').read_text())
          google = json.loads(Path('build/release/android-selection.json').read_text())
          try:
              selected = paired_store_builds(apple, google)
          except ValueError as error:
              raise SystemExit(str(error))
          version = selected['version']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key, value in selected.items():
                  output.write(f'{key}={value}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write(f"Selected {version}: iOS build {apple['build']['build_number']}, Android code {google['version_code']}.\n")
          PY
      - name: Submit existing iOS build to App Review
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_APP_ID: ${{ vars.ASC_APP_ID }}
          SELECTED_BUILD_ID: ${{ steps.selected.outputs.ios_build_id }}
        run: |
          notes=()
          if [ -n "$CARDBAL_NOTES_FILE" ]; then notes=(--release-notes-file "$CARDBAL_NOTES_FILE"); fi
          python3 -m tools.release.app_store submit --app-id "$ASC_APP_ID" \
            --expected-build-id "$SELECTED_BUILD_ID" "${notes[@]}" > build/release/ios-result.json
          cat build/release/ios-result.json
      - name: Promote existing Play internal bundle to production
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          SELECTED_VERSION: ${{ steps.selected.outputs.version }}
          SELECTED_VERSION_CODE: ${{ steps.selected.outputs.android_version_code }}
        run: |
          python3 android/tools/play_release.py promote-latest-to-production \
            --expected-version "$SELECTED_VERSION" --expected-version-code "$SELECTED_VERSION_CODE" \
            --metadata-out build/release/android-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-results
          path: build/release/*.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Remove temporary Apple key
        if: always()
        run: rm -rf "$RUNNER_TEMP/cardbal-release"
