name: Validate monorepo

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  data-and-swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile pinned station catalog
        run: python3 -m tools.stations.build --source csv --target all --no-sync-android
      - name: Test tools and production Swift readers
        run: python3 -m unittest discover -s tests -t . -v

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and assemble Android
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug

  station-reports:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/station-reports
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: services/station-reports/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
