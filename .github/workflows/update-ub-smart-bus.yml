name: Sync pinned CSV station data

on:
  schedule:
    - cron: "15 21 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-ub-smart-bus-master
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Test downloader
        run: python -m unittest discover -s scripts/tests -p 'test_download_ub_smart_bus.py'

      - name: Compile pinned CSV station data
        run: >-
          python scripts/build_cross_platform_station_assets.py
          --target all
          --source csv
          --no-sync-android

      - name: Commit current state when changed
        shell: bash
        run: |
          if git diff --quiet -- StationAssets CardBal/Resources; then
            git restore StationAssets/manifest.json
            echo "Pinned CSV station data is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add StationAssets CardBal/Resources
          git commit -m "Sync pinned CSV station data"
          git push origin HEAD:master
