name: Google Play internal
run-name: Google Play internal upload ${{ inputs.version || 'repository version' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Marketing version; blank uses the version in the app projects'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cardbal-stores
  cancel-in-progress: false

jobs:
  android:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - id: version
        name: Validate version and assign a new build number
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 -m tools.release.versions
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: python3 -m pip install -r android/tools/requirements-play.txt
      - name: Test Play release helper
        run: python3 -m unittest discover -s android/tools/tests -v
      - name: Restore upload keystore
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'cardbal-upload.jks'
          path.write_bytes(base64.b64decode(os.environ['ANDROID_UPLOAD_KEYSTORE_BASE64'], validate=True))
          path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'CARDBAL_UPLOAD_STORE_FILE={path}\n')
          PY
      - name: Restore optional Firebase configuration
        env:
          FIREBASE_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, json, os
          from pathlib import Path
          os.umask(0o077)
          encoded = ''.join(os.environ.get('FIREBASE_GOOGLE_SERVICES_JSON_BASE64', '').split())
          if not encoded:
              print('Firebase configuration is absent; building with analytics disabled.')
              raise SystemExit
          data = base64.b64decode(encoded, validate=True)
          clients = json.loads(data).get('client', [])
          packages = {client.get('client_info', {}).get('android_client_info', {}).get('package_name') for client in clients}
          if 'ad.neko.cardbal.android' not in packages:
              raise SystemExit('google-services.json has no ad.neko.cardbal.android client.')
          path = Path('android/app/google-services.json')
          path.write_bytes(data)
          path.chmod(0o600)
          PY
      - name: Test and build signed Android bundle
        working-directory: android
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.android_version_code }}
          CARDBAL_UPLOAD_STORE_PASSWORD: ${{ secrets.CARDBAL_UPLOAD_STORE_PASSWORD }}
          CARDBAL_UPLOAD_KEY_ALIAS: ${{ secrets.CARDBAL_UPLOAD_KEY_ALIAS }}
          CARDBAL_UPLOAD_KEY_PASSWORD: ${{ secrets.CARDBAL_UPLOAD_KEY_PASSWORD }}
          OCTOPUS_ENQUIRY_BASE_URL: ${{ secrets.OCTOPUS_ENQUIRY_BASE_URL }}
        run: ./gradlew :app:testDebugUnitTest :app:bundleRelease --no-daemon -Ptransitic.versionName="$RELEASE_VERSION" -Ptransitic.versionCode="$ANDROID_VERSION_CODE"
      - name: Upload to Google Play internal testing
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.android_version_code }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 android/tools/play_release.py upload-internal \
            --bundle android/app/build/outputs/bundle/release/app-release.aab \
            --version "$RELEASE_VERSION" --version-code "$ANDROID_VERSION_CODE" \
            --metadata-out build/upload/android.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-${{ steps.version.outputs.version }}-${{ steps.version.outputs.android_version_code }}
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            build/upload/android.json
          retention-days: 14
      - name: Remove upload keystore and Firebase configuration
        if: always()
        run: rm -f "$RUNNER_TEMP/cardbal-upload.jks" android/app/google-services.json
      - name: Record upload
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.android_version_code }}
        run: echo "Uploaded Android $RELEASE_VERSION ($ANDROID_VERSION_CODE) to Google Play internal testing." >> "$GITHUB_STEP_SUMMARY"
