name: TestFlight
run-name: TestFlight upload ${{ inputs.version || 'repository version' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Marketing version; blank uses the version in the app projects'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cardbal-stores
  cancel-in-progress: false

jobs:
  ios:
    if: github.ref == 'refs/heads/master'
    # iPhone Duo layouts need the iOS 27.1 SDK or later; older SDKs build
    # an app that runs in a compatibility window on the Duo.
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - id: version
        name: Validate version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 -m tools.release.versions
      - name: Install App Store Connect client
        run: python3 -m pip install -r tools/release/requirements-appstore.txt
      - id: build
        name: Assign the next build number
        # One above the highest plain build number already in App Store Connect.
        env:
          ASC_APP_ID: ${{ vars.ASC_APP_ID }}
          ASC_KEY_TYPE: ${{ vars.ASC_KEY_TYPE || 'team' }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: python3 -m tools.release.ios_build_number
      - run: xcodebuild -version
      - name: Compile pinned station catalog
        run: python3 -m tools.stations.build --source csv --target all --no-sync-android
      - name: Test shared tools and Swift readers
        run: python3 -m unittest discover -s tests -t .
      - name: Archive and export signed iOS app
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          IOS_BUILD_NUMBER: ${{ steps.build.outputs.ios_build }}
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          FIREBASE_GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.FIREBASE_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
          OCTOPUS_ENQUIRY_BASE_URL: ${{ secrets.OCTOPUS_ENQUIRY_BASE_URL }}
        run: bash tools/release/ios_archive.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-${{ steps.version.outputs.version }}-${{ steps.build.outputs.ios_build }}
          path: |
            build/ios/export/*.ipa
            build/ios/CardBal.xcarchive/dSYMs
          retention-days: 14
      - name: Upload to TestFlight
        env:
          ASC_KEY_TYPE: ${{ vars.ASC_KEY_TYPE || 'team' }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: python3 -m tools.release.testflight --ipa build/ios/export/CardBal.ipa
      - name: Record upload
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          IOS_BUILD_NUMBER: ${{ steps.build.outputs.ios_build }}
        run: echo "Uploaded iOS $RELEASE_VERSION ($IOS_BUILD_NUMBER) to TestFlight. Apple processing may still be pending." >> "$GITHUB_STEP_SUMMARY"
