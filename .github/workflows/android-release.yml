name: Android release
run-name: Release CardBal for Android

on:
  # A push publishes the APK only when the repository version has no
  # android-v<version> release yet, so ordinary commits finish after the plan job.
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cardbal-android-release
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - id: version
        name: Validate version
        run: python3 -m tools.release.versions
      - id: plan
        name: Decide whether this version needs an Android release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "android-v$RELEASE_VERSION" >/dev/null 2>&1; then
            if [ "$GITHUB_EVENT_NAME" = push ]; then
              echo "::notice::android-v$RELEASE_VERSION is already published; no Android build needed."
              echo "release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "android-v$RELEASE_VERSION already exists; refusing to replace a published release." >&2
            exit 1
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"

  release:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - id: version
        name: Validate version and assign a new version code
        run: python3 -m tools.release.versions
      - name: Check existing tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "android-v$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "android-v$RELEASE_VERSION already exists; refusing to replace a published release." >&2
            exit 1
          fi
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Restore upload keystore
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'cardbal-upload.jks'
          path.write_bytes(base64.b64decode(os.environ['ANDROID_UPLOAD_KEYSTORE_BASE64'], validate=True))
          path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'CARDBAL_UPLOAD_STORE_FILE={path}\n')
          PY
      - name: Restore optional Firebase configuration
        env:
          FIREBASE_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, json, os
          from pathlib import Path
          os.umask(0o077)
          encoded = ''.join(os.environ.get('FIREBASE_GOOGLE_SERVICES_JSON_BASE64', '').split())
          if not encoded:
              print('Firebase configuration is absent; building with analytics disabled.')
              raise SystemExit
          data = base64.b64decode(encoded, validate=True)
          clients = json.loads(data).get('client', [])
          packages = {client.get('client_info', {}).get('android_client_info', {}).get('package_name') for client in clients}
          if 'ad.neko.cardbal.android' not in packages:
              raise SystemExit('google-services.json has no ad.neko.cardbal.android client.')
          path = Path('android/app/google-services.json')
          path.write_bytes(data)
          path.chmod(0o600)
          PY
      - name: Test and build signed Android APK
        working-directory: android
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.android_version_code }}
          CARDBAL_UPLOAD_STORE_PASSWORD: ${{ secrets.CARDBAL_UPLOAD_STORE_PASSWORD }}
          CARDBAL_UPLOAD_KEY_ALIAS: ${{ secrets.CARDBAL_UPLOAD_KEY_ALIAS }}
          CARDBAL_UPLOAD_KEY_PASSWORD: ${{ secrets.CARDBAL_UPLOAD_KEY_PASSWORD }}
          OCTOPUS_ENQUIRY_BASE_URL: ${{ secrets.OCTOPUS_ENQUIRY_BASE_URL }}
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease --no-daemon -Ptransitic.versionName="$RELEASE_VERSION" -Ptransitic.versionCode="$ANDROID_VERSION_CODE"
      - name: Verify signature and package release
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk"
          mkdir -p build/android/release
          cp "$apk" "build/android/release/CardBal-$RELEASE_VERSION-android.apk"
          cd build/android/release
          sha256sum ./*.apk > SHA256SUMS.txt
      - name: Write release notes
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          version = os.environ['RELEASE_VERSION']
          notes = Path(f'docs/release-notes/android-{version}.md')
          store = Path(f'docs/release-notes/{version}.json')
          if notes.is_file() and notes.read_text().strip():
              text = notes.read_text()
          elif store.is_file():
              locales = json.loads(store.read_text())
              text = '\n\n'.join(locales[key] for key in ('en-GB', 'zh-Hans', 'ja', 'ko') if locales.get(key))
          else:
              text = ''
          Path('build/android/release-notes.md').write_text(text)
          PY
      - name: Publish Android release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          notes=(--generate-notes)
          if [ -s build/android/release-notes.md ]; then notes=(--notes-file build/android/release-notes.md); fi
          gh release create "android-v$RELEASE_VERSION" \
            --target "$GITHUB_SHA" --title "CardBal $RELEASE_VERSION for Android" "${notes[@]}" \
            "build/android/release/CardBal-$RELEASE_VERSION-android.apk" \
            build/android/release/SHA256SUMS.txt
      - name: Remove upload keystore and Firebase configuration
        if: always()
        run: rm -f "$RUNNER_TEMP/cardbal-upload.jks" android/app/google-services.json
      - name: Record release
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.android_version_code }}
        run: echo "Published android-v$RELEASE_VERSION ($ANDROID_VERSION_CODE) on GitHub." >> "$GITHUB_STEP_SUMMARY"
